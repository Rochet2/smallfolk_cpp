name: C/C++ CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            configure: cmake -B build -DSMALLFOLK_BUILD_TESTS=ON -DSMALLFOLK_BUILD_BENCHMARK=ON -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --config Release
            test: ctest --test-dir build -C Release --output-on-failure
          - os: windows-latest
            configure: cmake -B build -DSMALLFOLK_BUILD_TESTS=ON -DSMALLFOLK_BUILD_BENCHMARK=ON
            build: cmake --build build --config Release
            test: ctest --test-dir build -C Release --output-on-failure
          - os: macos-latest
            configure: cmake -B build -DSMALLFOLK_BUILD_TESTS=ON -DSMALLFOLK_BUILD_BENCHMARK=ON -DCMAKE_BUILD_TYPE=Release
            build: cmake --build build --config Release
            test: ctest --test-dir build -C Release --output-on-failure

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.test }}

  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install analysis tools
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck

      - name: Configure
        run: cmake -B build -DSMALLFOLK_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: cppcheck
        run: cmake --build build --target smallfolk_cppcheck

      - name: clang-tidy
        run: cmake --build build --target smallfolk_clang_tidy

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
